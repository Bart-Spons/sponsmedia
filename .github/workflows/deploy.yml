# Bouwt de site en zet hem live op Hostinger bij elke push naar main.
#
# Eenmalig instellen in GitHub: Settings → Secrets and variables → Actions → New repository secret
#   FTP_SERVER    bijv. ftp.sponsmedia.com (staat in Hostinger hPanel → Files → FTP Accounts)
#   FTP_USERNAME  je FTP-gebruikersnaam
#   FTP_PASSWORD  je FTP-wachtwoord
#
# Vereist dat next.config.mjs bij een productie-build `output: "export"` gebruikt,
# zodat `npm run build` de statische site in de map `out/` zet.

name: Deploy naar Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # handmatig starten via het tabblad Actions

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        run: npm ci

      - name: Statische site bouwen
        run: npm run build

      - name: lftp installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # lftp in plaats van een upload-action: Hostinger verbreekt de FTP-verbinding geregeld,
      # en lftp maakt dan zelf opnieuw verbinding en gaat verder.
      # Er wordt niets verwijderd op de server; bestanden worden alleen toegevoegd of overschreven.
      - name: Uploaden naar Hostinger via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          # lftp leest het wachtwoord uit LFTP_PASSWORD (--env-password), zodat
          # speciale tekens in het wachtwoord niet verkeerd gelezen worden.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Spaties of "ftp://" die per ongeluk in de secrets staan weghalen
          SERVER="$(echo "$FTP_SERVER" | tr -d '[:space:]' | sed -e 's#^ftps\?://##' -e 's#/$##')"
          USERNAME="$(echo "$FTP_USERNAME" | tr -d '[:space:]')"
          echo "Verbinden met $SERVER als $USERNAME"

          cat > deploy.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set mirror:parallel-transfer-count 3
          open --env-password -u "$USERNAME" "$SERVER"
          ls
          mirror --reverse --verbose=1 --no-perms ./out/ ./
          bye
          EOF
          lftp -f deploy.lftp
